[platformio]
default_envs = node_a

[env]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
build_flags = -D ARDUINO_USB_CDC_ON_BOOT=1 -D ARDUINO_USB_MODE=1
lib_deps =
    jgromes/RadioLib@^7.4.0
    olikraus/U8g2@^2.36.15

[env:node_a]
build_flags = ${env.build_flags} -D NODE_ID=1

[env:node_b]
build_flags = ${env.build_flags} -D NODE_ID=2
